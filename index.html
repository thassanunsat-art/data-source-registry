<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทะเบียนแหล่งข้อมูล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
:root{
  --bg:#E9ECEA; --surface:#FDFDFC; --sunk:#F1F3F1; --line:#D4DAD6; --line-strong:#B9C2BD;
  --ink:#14201D; --muted:#5A6763; --faint:#87938E;
  --accent:#12594F; --accent-ink:#0B3F38; --accent-soft:#D6E7E2; --accent-on:#FFFFFF;
  --warn:#8C5510; --warn-soft:#F4E6D2;
  --d1:#3A5A88; --d1s:#DDE5F0;
  --d2:#12716A; --d2s:#D5E9E6;
  --d3:#8A5E14; --d3s:#F1E6CE;
  --d4:#4A6F2E; --d4s:#DFE9D4;
  --d5:#74478A; --d5s:#E8DEEE;
  --d6:#9E4F3A; --d6s:#F2DFD8;
  --d0:#6B7671; --d0s:#E4E8E5;
  --shadow:0 1px 2px rgba(20,32,29,.06), 0 8px 24px -12px rgba(20,32,29,.22);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111716; --surface:#1A2120; --sunk:#161D1C; --line:#2B3533; --line-strong:#3D4946;
  --ink:#E7ECE9; --muted:#9BA8A3; --faint:#78847F;
  --accent:#5FC2B3; --accent-ink:#8FD8CC; --accent-soft:#1D3733; --accent-on:#0C1817;
  --warn:#D9A05B; --warn-soft:#332818;
  --d1:#8FAEDC; --d1s:#22303F;
  --d2:#6CC7BC; --d2s:#173330;
  --d3:#D6AC62; --d3s:#332A17;
  --d4:#9DC57C; --d4s:#232F1C;
  --d5:#C49BD4; --d5s:#2E2436;
  --d6:#DE9B84; --d6s:#35251F;
  --d0:#98A39E; --d0s:#242B29;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#1A2120; --sunk:#161D1C; --line:#2B3533; --line-strong:#3D4946;
  --ink:#E7ECE9; --muted:#9BA8A3; --faint:#78847F;
  --accent:#5FC2B3; --accent-ink:#8FD8CC; --accent-soft:#1D3733; --accent-on:#0C1817;
  --warn:#D9A05B; --warn-soft:#332818;
  --d1:#8FAEDC; --d1s:#22303F;
  --d2:#6CC7BC; --d2s:#173330;
  --d3:#D6AC62; --d3s:#332A17;
  --d4:#9DC57C; --d4s:#232F1C;
  --d5:#C49BD4; --d5s:#2E2436;
  --d6:#DE9B84; --d6s:#35251F;
  --d0:#98A39E; --d0s:#242B29;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Noto Serif Thai","IBM Plex Sans Thai",serif; font-weight:700; line-height:1.35; text-wrap:balance; margin:0}
button,input{font:inherit; color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1120px; margin:0 auto; padding-inline:18px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- header + search ---------- */
header.top{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
}
.topbar{display:flex; align-items:center; gap:12px; padding-block:12px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand h1{font-size:19px; letter-spacing:-.01em}
.brand .sub{color:var(--faint); font-size:12.5px}
.search{
  flex:1 1 300px; display:flex; align-items:center; gap:9px; background:var(--sunk);
  border:1px solid var(--line); border-radius:99px; padding:7px 15px; min-width:0;
}
.search:focus-within{border-color:var(--accent)}
.search input{border:0; background:transparent; outline:0; width:100%; font-size:14.5px; min-width:0}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none}
.search .clr{border:0; background:transparent; color:var(--faint); cursor:pointer; padding:0 2px; font-size:16px; line-height:1}
.iconbtn{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  width:36px; height:36px; border-radius:99px; cursor:pointer; display:grid; place-items:center; font-size:15px; flex:none;
}
.iconbtn:hover{border-color:var(--line-strong); color:var(--ink)}

/* ---------- dimension nav ---------- */
.dimnav{display:flex; gap:7px; flex-wrap:wrap; padding-block:0 12px}
.dimnav a{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:13px; font-weight:500;
  border:1px solid var(--line); border-radius:99px; padding:4px 13px 4px 9px; color:var(--muted); background:var(--surface);
}
.dimnav a:hover{border-color:var(--line-strong); color:var(--ink)}
.dot{width:9px; height:9px; border-radius:99px; flex:none}
.dimnav a .c{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--faint)}

main{padding-block:24px 72px}

/* ---------- sections ---------- */
.sec{margin-bottom:34px; scroll-margin-top:96px}
.sec-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:10px; border-bottom:2px solid var(--secline); margin-bottom:14px}
.sec-head h2{font-size:18px}
.sec-head .n{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--faint)}
.sec-head .desc{color:var(--muted); font-size:13px; width:100%; margin-top:-2px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px;
  display:grid; gap:9px; align-content:start; cursor:pointer; text-align:left; font:inherit; color:inherit;
}
.card:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
.card .idline{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card .id{font-size:11.5px; color:var(--faint); letter-spacing:.04em}
.card h3{font-size:15.5px; font-weight:600; font-family:inherit; line-height:1.45}
.card .org{color:var(--muted); font-size:12.5px; line-height:1.5}
.card .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px}

.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500;
  padding:3px 10px; border-radius:99px; background:var(--sunk); color:var(--muted); border:1px solid var(--line);
  white-space:nowrap;
}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.good{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.chip.dim{border-color:transparent}
.dim-1{background:var(--d1s); color:var(--d1)} .dim-2{background:var(--d2s); color:var(--d2)}
.dim-3{background:var(--d3s); color:var(--d3)} .dim-4{background:var(--d4s); color:var(--d4)}
.dim-5{background:var(--d5s); color:var(--d5)} .dim-6{background:var(--d6s); color:var(--d6)}
.dim-0{background:var(--d0s); color:var(--d0)}
mark{background:var(--accent-soft); color:inherit; border-radius:3px; padding:0 1px}

.hits{color:var(--muted); font-size:13.5px; padding-bottom:16px}
.empty{background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--radius); padding:40px 20px; text-align:center; color:var(--muted)}

/* ---------- detail dialog ---------- */
dialog{
  border:1px solid var(--line); border-radius:14px; padding:0; background:var(--surface); color:var(--ink);
  max-width:640px; width:calc(100% - 32px); box-shadow:0 30px 70px -30px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(12,20,18,.5)}
.dl-head{padding:20px 22px 14px; border-bottom:1px solid var(--line); display:grid; gap:9px}
.dl-head h2{font-size:19px}
.dl-dims{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.dl-body{padding:18px 22px 22px; display:grid; gap:14px; max-height:min(64vh,560px); overflow:auto}
.kv{display:grid; grid-template-columns:118px 1fr; gap:8px 14px; font-size:14px}
.kv dt{color:var(--faint); font-size:12.5px; padding-top:2px}
.kv dd{margin:0}
.note{background:var(--sunk); border-left:3px solid var(--line-strong); padding:10px 13px; border-radius:0 8px 8px 0; font-size:13.5px; color:var(--muted)}
.note.warn{border-left-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
.eyebrow{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:600}
.links{display:grid; gap:7px}
.links a{
  display:block; background:var(--accent-soft); color:var(--accent-ink); text-decoration:none;
  padding:9px 13px; border-radius:8px; font-size:13px; word-break:break-all; border:1px solid transparent;
}
.links a:hover{border-color:var(--accent)}
.dl-foot{padding:0 22px 20px; display:flex; justify-content:flex-end}
.btn{
  border:1px solid var(--line); background:transparent; color:var(--muted);
  padding:8px 18px; border-radius:99px; cursor:pointer; font-weight:600; font-size:14px;
}
.btn:hover{color:var(--ink); border-color:var(--line-strong)}

footer.pg{color:var(--faint); font-size:12.5px; border-top:1px solid var(--line); margin-top:36px; padding-top:16px}
@media (max-width:560px){
  .brand .sub{display:none}
  .kv{grid-template-columns:1fr; gap:2px 0}
  .kv dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>ทะเบียนแหล่งข้อมูล</h1>
        <span class="sub mono" id="brandCount"></span>
      </div>
      <label class="search">
        <span aria-hidden="true" style="color:var(--faint)">⌕</span>
        <input id="q" type="search" placeholder="ค้นหาชื่อชุดข้อมูล หน่วยงาน ปี หรือคำสำคัญ…" autocomplete="off">
        <button class="clr" id="clr" type="button" hidden aria-label="ล้างคำค้น">✕</button>
      </label>
      <button class="iconbtn" id="themeBtn" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด">◐</button>
    </div>
    <nav class="dimnav" id="dimnav" aria-label="ข้ามไปยังมิติ"></nav>
  </div>
</header>

<main class="wrap">
  <p class="hits" id="hits" hidden></p>
  <div id="sections"></div>
  <div class="empty" id="empty" hidden>ไม่พบชุดข้อมูลที่ตรงกับคำค้น — ลองใช้คำสั้นลง เช่น ชื่อหน่วยงาน หรือคำว่า "ผู้สูงอายุ"</div>

  <footer class="pg">
    รวบรวมจากไฟล์ <span class="mono">list Data source.xlsx</span> — ตรวจสอบปีล่าสุดและเงื่อนไขการใช้งานกับหน่วยงานเจ้าของข้อมูลก่อนนำไปอ้างอิง
  </footer>
</main>

<dialog id="dlg">
  <div class="dl-head">
    <div class="dl-dims"><span class="mono" id="dlId" style="font-size:12px; color:var(--faint)"></span><span id="dlDim"></span></div>
    <h2 id="dlName"></h2>
  </div>
  <div class="dl-body" id="dlBody"></div>
  <div class="dl-foot"><button class="btn" id="dlClose">ปิด</button></div>
</dialog>

const el = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dimOf = k => DIMS.find(d=>d.key===k) || DIMS[DIMS.length-1];
/* ชุดข้อมูลบางชุดครอบคลุมหลายมิติ — dims เก็บทุกมิติ โดย dim คือมิติหลัก */
const dimsOf = it => (it.dims && it.dims.length) ? it.dims : [it.dim || ""];

/* ---------- theme ---------- */
(function(){
  let saved=null; try{ saved=localStorage.getItem("ds-theme"); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  el("themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const sysDark=matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{ localStorage.setItem("ds-theme",next); }catch(e){}
  });
})();

/* ---------- pieces ---------- */
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const i = t.toLowerCase().indexOf(q);
  if(i<0) return t;
  return t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length);
}
function dimChips(it){
  return dimsOf(it).map(k=>{ const d=dimOf(k);
    return `<span class="chip dim ${d.cls}">${esc(d.short)}</span>`; }).join("");
}
function metaChips(it){
  const c=[];
  if(it.level) c.push(`<span class="chip">${esc(it.level)}</span>`);
  if(it.years) c.push(`<span class="chip mono">${esc(it.years)}</span>`);
  if(it.freq)  c.push(`<span class="chip">${esc(it.freq)}</span>`);
  if(it.ftype) c.push(`<span class="chip">${esc(it.ftype)}</span>`);
  c.push(it.urls.length ? `<span class="chip good">มีลิงก์</span>` : `<span class="chip warn">ยังไม่มีลิงก์</span>`);
  if(it.added) c.push(`<span class="chip" style="border-style:dashed">ลิงก์ที่ค้นเพิ่ม</span>`);
  if(dimsOf(it).length>1) c.push(`<span class="chip">อยู่ใน ${dimsOf(it).length} มิติ</span>`);
  return c.join("");
}

/* ---------- detail ---------- */
const dlg = el("dlg");
function openDetail(it){
  el("dlId").textContent = it.id;
  el("dlDim").innerHTML = dimChips(it);
  el("dlName").textContent = it.name;
  const rows=[
    ["ช่วงปีข้อมูล", it.years], ["ระดับพื้นที่", it.level], ["ความถี่", it.freq],
    ["รูปแบบไฟล์", it.ftype], ["หน่วยงาน/แหล่ง", it.org],
    ["รายละเอียด", it.detail], ["วิธีการคำนวณ", it.method]
  ].filter(r=>r[1]);
  let html = `<dl class="kv">${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>`;
  if(it.note) html += `<div class="note">${esc(it.note)}</div>`;
  if(it.urls.length){
    html += `<div><div class="eyebrow" style="margin-bottom:7px">ลิงก์แหล่งข้อมูล</div><div class="links">${
      it.urls.map(u=>{ let l=u; try{ l=decodeURIComponent(u); }catch(e){}
        if(l.length>110) l=l.slice(0,110)+"…";
        return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`; }).join("")
    }</div></div>`;
  } else {
    html += `<div class="note warn">ยังไม่มีลิงก์ดาวน์โหลดในทะเบียน — ต้องติดต่อขอข้อมูลจากหน่วยงานเจ้าของโดยตรง</div>`;
  }
  el("dlBody").innerHTML = html;
  dlg.showModal();
}
el("dlClose").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click", e=>{ if(e.target===dlg) dlg.close(); });

/* ---------- render ---------- */
const SECTIONS = DIMS.map(d=>({d, items: DATA.filter(x=>dimsOf(x).includes(d.key))}))
                     .filter(s=>s.items.length);

el("dimnav").innerHTML = SECTIONS.map(s=>
  `<a href="#sec-${s.d.cls}"><span class="dot" style="background:var(${s.d.v})"></span>${esc(s.d.short)} <span class="c">${s.items.length}</span></a>`
).join("");

el("sections").innerHTML = SECTIONS.map(s=>`
  <section class="sec" id="sec-${s.d.cls}" style="--secline:var(${s.d.v})">
    <div class="sec-head">
      <h2>${esc(s.d.short)}</h2>
      <span class="n" data-n>${s.items.length} ชุดข้อมูล</span>
      <span class="desc">${esc(s.d.help)}</span>
    </div>
    <div class="grid">${s.items.map(it=>`
      <button class="card" data-id="${esc(it.id)}" data-sec="${s.d.cls}">
        <span class="idline"><span class="mono id">${esc(it.id)}</span>${
          dimsOf(it).filter(k=>k!==s.d.key).map(k=>{const dd=dimOf(k);
            return `<span class="chip dim ${dd.cls}" style="font-size:11.5px">${esc(dd.short)}</span>`;}).join("")
        }</span>
        <h3 data-name>${esc(it.name)}</h3>
        ${it.org?`<span class="org" data-org>${esc(it.org)}</span>`:""}
        <span class="tags">${metaChips(it)}</span>
      </button>`).join("")}
    </div>
  </section>`).join("");

const CARDS = [...document.querySelectorAll(".card")];
CARDS.forEach(b=>b.addEventListener("click",()=>openDetail(DATA.find(d=>d.id===b.dataset.id))));

/* ---------- search ---------- */
function haystack(it){
  return [it.id,it.name,it.org,it.note,it.detail,it.method,it.level,it.years,it.freq,it.ftype,
          dimsOf(it).map(k=>dimOf(k).short).join(" ")].join(" ").toLowerCase();
}
const HAY = new Map(DATA.map(it=>[it.id, haystack(it)]));

function search(){
  const q = el("q").value.trim().toLowerCase();
  el("clr").hidden = !q;
  let shown = 0;
  const seen = new Set();
  document.querySelectorAll(".sec").forEach(sec=>{
    let n = 0;
    sec.querySelectorAll(".card").forEach(card=>{
      const it = DATA.find(d=>d.id===card.dataset.id);
      const ok = !q || HAY.get(it.id).includes(q);
      card.hidden = !ok;
      if(ok){ n++; seen.add(it.id);
        card.querySelector("[data-name]").innerHTML = hl(it.name, q);
        const o = card.querySelector("[data-org]");
        if(o) o.innerHTML = hl(it.org, q);
      }
    });
    sec.hidden = n===0;
    sec.querySelector("[data-n]").textContent = n + " ชุดข้อมูล";
    shown += n;
  });
  el("hits").hidden = !q;
  el("hits").textContent = q ? `พบ ${seen.size} ชุดข้อมูลที่ตรงกับ "${el("q").value.trim()}"` : "";
  el("empty").hidden = shown>0;
}
el("q").addEventListener("input", search);
el("clr").addEventListener("click",()=>{ el("q").value=""; el("q").focus(); search(); });

el("brandCount").textContent = `${DATA.length} ชุดข้อมูล · ${SECTIONS.filter(s=>s.d.key).length} มิติ`;
search();
</script>
